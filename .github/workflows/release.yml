name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version et notes
        id: meta
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          awk -v h="## [$V]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Voir CHANGELOG.md" > notes.md

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""; [ "${{ steps.meta.outputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "Allumi $GITHUB_REF_NAME" --notes-file notes.md $FLAGS

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: hashFiles('package.json') != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image Docker (GHCR)
        if: hashFiles('package.json') != ''
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="-t $IMG:${{ steps.meta.outputs.version }}"
          [ "${{ steps.meta.outputs.prerelease }}" = "false" ] && TAGS="$TAGS -t $IMG:latest"
          docker buildx build --target runner --build-arg APP_VERSION=${{ steps.meta.outputs.version }} $TAGS --push .
