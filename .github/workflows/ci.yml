name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: allumi
          POSTGRES_USER: allumi
          POSTGRES_PASSWORD: allumi_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allumi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Propriétaire (migrations, gabarit des tests) et rôle restreint de l'application.
      DATABASE_URL: postgresql://allumi:allumi_ci_only@localhost:5432/allumi?schema=public
      APP_DB_PASSWORD: allumi_app_ci_only
      APP_DATABASE_URL: postgresql://allumi_app:allumi_app_ci_only@localhost:5432/allumi
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Scripts shell
        run: |
          bash -n scripts/*.sh
          python3 scripts/test-update-agent.py
          python3 scripts/test-install-docker.py
          shellcheck -x -P SCRIPTDIR -S warning scripts/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances et client Prisma
        run: |
          npm ci
          npx prisma generate
      - name: Migrations (propriétaire) et rôle de l'application
        run: npm run db:migrate
      - name: Aucune dérive entre le schéma Prisma et la base migrée
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Lint, types, tests, audit
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: allumi
          POSTGRES_USER: allumi
          POSTGRES_PASSWORD: allumi_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allumi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://allumi:allumi_ci_only@localhost:5432/allumi?schema=public
      APP_DB_PASSWORD: allumi_app_ci_only
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Parcours dans un navigateur (serveur autonome, base neuve)
        run: npm run test:e2e
      - name: Parcours mobile tactile (base neuve)
        run: E2E_MOBILE=1 npm run test:e2e

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build + démarrage de la pile + healthcheck
        run: |
          ./scripts/install-docker.sh --domain allumi.example.invalid --email ci@example.invalid --http-port 8080 --https-port 8443 --bind 127.0.0.1 --timeout 120
      - name: La page /setup répond depuis l'image (base, rôle restreint, traductions, jeton d'installation)
        run: |
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/setup').then(async (r) => { const t = await r.text(); process.exit(r.ok && t.includes('Bienvenue dans Allumi') && t.includes('setupToken') ? 0 : 1); }).catch(() => process.exit(1))"
      - name: Ports personnalisés et redirection HTTPS
        run: |
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          curl --retry 10 --retry-connrefused --retry-delay 1 -sS -D /tmp/redirect-headers -o /dev/null -H 'Host: allumi.example.invalid' 'http://127.0.0.1:8080/setup?test=1'
          grep -i '^location: https://allumi.example.invalid:8443/setup?test=1' /tmp/redirect-headers
          docker compose port caddy 443 | grep -Fx '127.0.0.1:8443'
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs migrate app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run dist -- --win --x64
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-installer
          path: desktop/dist/*.exe
