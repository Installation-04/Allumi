name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: allumi
          POSTGRES_USER: allumi
          POSTGRES_PASSWORD: allumi_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allumi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Propriétaire (migrations, gabarit des tests) et rôle restreint de l'application.
      DATABASE_URL: postgresql://allumi:allumi_ci_only@localhost:5432/allumi?schema=public
      APP_DB_PASSWORD: allumi_app_ci_only
      APP_DATABASE_URL: postgresql://allumi_app:allumi_app_ci_only@localhost:5432/allumi
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Scripts shell
        run: |
          bash -n scripts/*.sh
          python3 scripts/test-server-admin-agent.py
          python3 scripts/test-update-agent.py
          python3 scripts/test-enable-web-updates.py
          python3 scripts/test-install-docker.py
          python3 scripts/test-get.py
          python3 scripts/test-local-https.py
          python3 scripts/test-tls-backup.py
          shellcheck -x -P SCRIPTDIR -S warning scripts/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances et client Prisma
        run: |
          npm ci
          npx prisma generate
      - name: Migrations (propriétaire) et rôle de l'application
        run: npm run db:migrate
      - name: Aucune dérive entre le schéma Prisma et la base migrée
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Lint, types, tests, audit
        run: |
          npm run lint
          npm run typecheck
          # Keep the timed database guard isolated from other test workers.
          npm test -- --maxWorkers=1
          npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: allumi
          POSTGRES_USER: allumi
          POSTGRES_PASSWORD: allumi_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allumi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://allumi:allumi_ci_only@localhost:5432/allumi?schema=public
      APP_DB_PASSWORD: allumi_app_ci_only
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Parcours dans un navigateur (serveur autonome, base neuve)
        id: desktop
        run: npm run test:e2e
      - name: Conserver les diagnostics du parcours ordinateur
        if: always() && steps.desktop.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: navigateur-ordinateur
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Parcours mobile tactile (base neuve)
        id: mobile
        run: E2E_MOBILE=1 npm run test:e2e

      - name: Conserver les diagnostics du parcours mobile
        if: always() && steps.mobile.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: navigateur-mobile
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build + démarrage de la pile + healthcheck
        run: |
          sudo ./scripts/install-docker.sh --build --app-url http://127.0.0.1:28080 --http-port 28080 --bind 127.0.0.1 --timeout 120
          # Follow-up Compose checks run as the runner; preserve private permissions while handing ownership back.
          sudo chown "$(id -u):$(id -g)" .env compose.override.yaml
          systemctl is-enabled --quiet allumi-update.timer
          systemctl is-active --quiet allumi-update.timer
          docker compose exec -T app node -e "if(process.env.ALLUMI_UPDATE_DIR !== '/app/storage/update-control') process.exit(1)"
      - name: Architecture native des images
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          for image in allumi-app:local allumi-migrate:local postgres:17-alpine; do
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          done
      - name: La page /setup répond depuis l'image (base, rôle restreint, traductions, jeton d'installation)
        run: |
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/setup').then(async (r) => { const t = await r.text(); process.exit(r.ok && t.includes('Bienvenue dans Allumi') && t.includes('setupToken') ? 0 : 1); }).catch(() => process.exit(1))"
      - name: HTTP direct et base privée
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:28080/api/health
          curl --fail -o /tmp/allumi-setup.html http://127.0.0.1:28080/setup
          grep -q setupToken /tmp/allumi-setup.html
          docker compose port app 3000 | grep -Fx '127.0.0.1:28080'
          docker inspect "$(docker compose ps -q db)" --format '{{json .NetworkSettings.Ports}}' | jq -e 'to_entries | all(.value == null or .value == [])'
          docker compose config --format json | jq -e '.services | keys == ["app", "db", "migrate"]'
      - name: HTTPS local sur IP avec autorité privée (conversion de la pile HTTP)
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          sudo ./scripts/install-docker.sh --build --local-https --app-url https://127.0.0.1:28080 --http-port 28080 --bind 127.0.0.1 --timeout 120
          sudo chown "$(id -u):$(id -g)" .env compose.override.yaml
          sudo ./scripts/enable-local-https.sh --export-ca
          test "$(stat -c '%a' local-https-root.crt)" = 644
          openssl x509 -in local-https-root.crt -noout -checkend 0
          if grep -q 'PRIVATE KEY' local-https-root.crt; then exit 1; fi
          # curl checks both the private CA chain and the certificate's IP SAN, without an insecure override.
          curl --fail --silent --show-error --cacert local-https-root.crt --retry 10 --retry-connrefused --retry-delay 1 https://127.0.0.1:28080/api/health | jq -e '.status == "ok"'
          curl --fail --silent --show-error --cacert local-https-root.crt --tlsv1.2 --tls-max 1.2 https://127.0.0.1:28080/api/health
          curl --fail --silent --show-error --cacert local-https-root.crt --tlsv1.3 --tls-max 1.3 https://127.0.0.1:28080/api/health
          curl --fail --silent --show-error --cacert local-https-root.crt -o /tmp/allumi-setup-https.html https://127.0.0.1:28080/setup
          grep -q setupToken /tmp/allumi-setup-https.html
          if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:28080/api/health; then exit 1; fi
          docker compose port caddy 8443 | grep -Fx '127.0.0.1:28080'
          for service in app db; do
            docker inspect "$(docker compose ps -q "$service")" --format '{{json .NetworkSettings.Ports}}' | jq -e 'to_entries | all(.value == null or .value == [])'
          done
          docker compose config --format json | jq -e '.services | keys == ["app", "caddy", "db", "migrate"]'
          test "$(docker image inspect --format '{{.Architecture}}' caddy:2.11.8-alpine)" = "$EXPECTED_ARCH"
          docker compose exec -T app node -e "if(process.env.TRUSTED_PROXY_HOPS !== '1' || process.env.APP_URL !== 'https://127.0.0.1:28080' || process.env.ALLUMI_UPDATE_DIR !== '/app/storage/update-control') process.exit(1)"
          systemctl is-enabled --quiet allumi-update.timer
          systemctl is-active --quiet allumi-update.timer
      - name: Agent serveur et sauvegarde réelle
        run: |
          sudo ./scripts/enable-server-admin.sh
          sudo systemctl stop allumi-server-admin.timer
          docker compose exec -T app node -e "require('node:fs').writeFileSync('/app/storage/server-control/request.json', JSON.stringify({operation:'backup',actor:'00000000-0000-4000-8000-000000000001',requestedAt:new Date().toISOString()}), {mode:0o600,flag:'wx'})"
          sudo systemctl start allumi-server-admin.service
          docker compose exec -T app node -e "const s=JSON.parse(require('node:fs').readFileSync('/app/storage/server-control/snapshot.json')); if(!s.backups.length || s.events.at(-1)?.state !== 'success') process.exit(1)"
          sudo systemctl disable allumi-server-admin.timer
          # Agent setup must preserve the local HTTPS overlay and keep app/database ports private.
          curl --fail --silent --show-error --cacert local-https-root.crt https://127.0.0.1:28080/api/health | jq -e '.status == "ok"'
          docker compose exec -T app node -e "if(process.env.TRUSTED_PROXY_HOPS !== '1' || process.env.ALLUMI_UPDATE_DIR !== '/app/storage/update-control') process.exit(1)"
          docker inspect "$(docker compose ps -q app)" --format '{{json .NetworkSettings.Ports}}' | jq -e 'to_entries | all(.value == null or .value == [])'
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run dist -- --win --x64
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-installer
          path: desktop/dist/*.exe
