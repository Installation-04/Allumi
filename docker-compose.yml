# Allumi — pile de production
# Usage : docker compose up -d   (voir docs/Installation.md)

name: allumi

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allumi}
      POSTGRES_USER: ${POSTGRES_USER:-allumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    image: allumi-migrate:local
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant dans .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  app:
    build:
      context: .
      target: runner
    image: allumi-app:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app_storage:/app/storage
      - app_cache:/app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ALLUMI_DOMAIN: ${ALLUMI_DOMAIN:?ALLUMI_DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
  app_storage:
  app_cache:
  caddy_data:
  caddy_config:
