# Allumi — pile de production
# Usage : docker compose up -d   (voir docs/Installation.md)

name: allumi

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allumi}
      POSTGRES_USER: ${POSTGRES_USER:-allumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    # Version publiée (voir scripts/lib.sh : select_images) ou, par défaut, image construite sur place.
    image: ${ALLUMI_MIGRATE_IMAGE:-allumi-migrate:local}
    restart: "no"
    environment:
      # Identifiants propriétaire : réservés à ce service. L'application ne les reçoit jamais.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant dans .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant dans .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  app:
    build:
      context: .
      target: runner
    image: ${ALLUMI_APP_IMAGE:-allumi-app:local}
    ports:
      - "${ALLUMI_BIND_ADDRESS:-0.0.0.0}:${ALLUMI_HTTP_PORT:-28080}:3000"
    restart: unless-stopped
    # Liste explicite (pas de env_file) : ni DATABASE_URL ni POSTGRES_PASSWORD (propriétaire) ici.
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL manquant dans .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-fr-CA}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app_storage:/app/storage
      - app_cache:/app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]


networks:
  internal:

volumes:
  db_data:
  app_storage:
  app_cache:
